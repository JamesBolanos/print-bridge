name: Release Installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows executable and MSI
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $version = '${{ github.ref_name }}'.TrimStart('v')
          $bin = 'dist/printer-bridge-windows-amd64.exe'
          $msi = 'dist/printer-bridge-windows-amd64.msi'

          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o $bin .

          if ($env:WINDOWS_SIGN_CERT_BASE64 -and $env:WINDOWS_SIGN_CERT_PASSWORD) {
            Write-Host 'Signing executable with signtool...'
            $certPath = "$env:RUNNER_TEMP\codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))

            & signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certPath /p $env:WINDOWS_SIGN_CERT_PASSWORD $bin
            if ($LASTEXITCODE -ne 0) { throw 'signtool signing failed' }

            Remove-Item -Force $certPath
          }
          else {
            Write-Host 'Signing skipped: configure WINDOWS_SIGN_CERT_BASE64 and WINDOWS_SIGN_CERT_PASSWORD secrets.'
          }

          wix build packaging/windows/printer-bridge.wxs `
            -d AppExe=$bin `
            -d ProductVersion=$version `
            -arch x64 `
            -o $msi

          Get-FileHash -Algorithm SHA256 $bin, $msi |
            ForEach-Object { "{0} *{1}" -f $_.Hash.ToLower(), (Split-Path -Leaf $_.Path) } |
            Out-File -FilePath 'dist/SHA256SUMS-windows.txt' -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/printer-bridge-windows-amd64.exe
            dist/printer-bridge-windows-amd64.msi
            dist/SHA256SUMS-windows.txt

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build app bundle and DMG
        run: |
          set -euo pipefail
          APP_NAME="printer-bridge"
          VERSION="${GITHUB_REF_NAME#v}"
          APP_DIR="dist/${APP_NAME}.app"
          CONTENTS_DIR="${APP_DIR}/Contents"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"
          ICONSET_DIR="dist/AppIcon.iconset"
          DMG_ROOT="dist/dmg-root"

          rm -rf dist
          mkdir -p "${CONTENTS_DIR}/MacOS" "${RESOURCES_DIR}" "${ICONSET_DIR}" "${DMG_ROOT}"

          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "${CONTENTS_DIR}/MacOS/${APP_NAME}" .
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "${CONTENTS_DIR}/Info.plist"
          cp internal/assets/icon.png "${RESOURCES_DIR}/icon.png"

          sips -z 16 16 internal/assets/icon.png --out "${ICONSET_DIR}/icon_16x16.png" >/dev/null
          sips -z 32 32 internal/assets/icon.png --out "${ICONSET_DIR}/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 internal/assets/icon.png --out "${ICONSET_DIR}/icon_32x32.png" >/dev/null
          sips -z 64 64 internal/assets/icon.png --out "${ICONSET_DIR}/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 internal/assets/icon.png --out "${ICONSET_DIR}/icon_128x128.png" >/dev/null
          sips -z 256 256 internal/assets/icon.png --out "${ICONSET_DIR}/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 internal/assets/icon.png --out "${ICONSET_DIR}/icon_256x256.png" >/dev/null
          sips -z 512 512 internal/assets/icon.png --out "${ICONSET_DIR}/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 internal/assets/icon.png --out "${ICONSET_DIR}/icon_512x512.png" >/dev/null
          cp internal/assets/icon.png "${ICONSET_DIR}/icon_512x512@2x.png"
          iconutil -c icns "${ICONSET_DIR}" -o "${RESOURCES_DIR}/AppIcon.icns"

          cp -R "${APP_DIR}" "${DMG_ROOT}/"
          ln -s /Applications "${DMG_ROOT}/Applications"
          hdiutil create -volname "${APP_NAME}" -srcfolder "${DMG_ROOT}" -ov -format UDZO "dist/${APP_NAME}-darwin-arm64.dmg"
          shasum -a 256 "dist/${APP_NAME}-darwin-arm64.dmg" > dist/SHA256SUMS-darwin.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/printer-bridge-darwin-arm64.dmg
            dist/SHA256SUMS-darwin.txt

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/printer-bridge-windows-amd64.exe
            release-assets/printer-bridge-windows-amd64.msi
            release-assets/SHA256SUMS-windows.txt
            release-assets/printer-bridge-darwin-arm64.dmg
            release-assets/SHA256SUMS-darwin.txt
